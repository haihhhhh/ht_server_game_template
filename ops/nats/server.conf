# 本机开发环境；跨主机监听和集群 routes 按部署网络另配。
listen: "127.0.0.1:14222"
accounts: {
  GAME_DEV: {
    users: [
      { user: gateway, password: $HT_NATS_GATEWAY_PASSWORD }
      { user: account, password: $HT_NATS_ACCOUNT_PASSWORD }
      { user: game, password: $HT_NATS_GAME_PASSWORD }
      { user: world, password: $HT_NATS_WORLD_PASSWORD }
    ]
  }
}
